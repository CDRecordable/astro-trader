# ============================================================
# Installer configuration
# ============================================================
# Produces a normal Windows installer (NSIS): double-click, next, done —
# with a Start Menu entry and a desktop shortcut. macOS and Linux targets are
# defined too, though they must be built on their own platform.

appId: app.astrotrader.insights
productName: Astro Trader Insights
copyright: © 2026 Víctor Balcells

directories:
  output: dist
  buildResources: build

# Only the shell itself goes in the asar; the server bundle rides along as a
# resource so Node can execute it as ordinary files.
files:
  - main.js
  - package.json
  # An explicit list REPLACES electron-builder's default, so node_modules must
  # be named or the shell ships without electron-updater and dies on its first
  # require. Only production dependencies are collected here; electron and
  # electron-builder stay out.
  - node_modules/**/*

extraResources:
  - from: app-server
    to: app-server

# Users install without admin rights, and can pick the folder.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Astro Trader
  deleteAppDataOnUninstall: false   # never delete someone's watchlist on uninstall
  # Keep the historical filename so existing download links keep working.
  artifactName: AstroTrader-Setup-${version}.${ext}

# Two Windows artifacts, for two different distribution routes:
#   · nsis — the normal installer, published to GitHub Releases and what the
#     in-app updater checks against.
#   · zip  — a portable build for hosting where an .exe is awkward to upload
#     or would be flagged (Patreon posts, for instance). Unzip and run; it
#     writes its data to the same per-user folder as the installed version.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  artifactName: AstroTrader-${version}-${arch}.${ext}

mac:
  target: [dmg]
  category: public.app-category.finance
  artifactName: AstroTrader-${version}-${arch}.${ext}

linux:
  target: [AppImage]
  category: Finance
  artifactName: AstroTrader-${version}.${ext}

# Distribution happens through GitHub Releases.
publish:
  provider: github
  owner: CDRecordable
  repo: astro-trader
